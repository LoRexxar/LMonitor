{% load wow_tags %}
<header class="spec-overview-hero">
    <div class="spec-overview-identity">
        <img src="{% wow_icon nav.spec_icon "small" %}" alt="" class="spec-overview-icon" width="56" height="56">
        <div>
            <p class="spec-overview-eyebrow">WoW 专精总览</p>
            <h1>{{ nav.class_cn }} {{ nav.spec_cn }}</h1>
            <p>人物、大秘境与团本数据按各自数据口径展示；各模块口径独立，不计算综合分。</p>
        </div>
    </div>
    <dl class="spec-overview-season">
        <dt>当前赛季</dt>
        <dd>{% if season %}{% firstof season.season_name season.season_key "未配置" %}{% else %}未配置{% endif %}</dd>
    </dl>
</header>

<nav class="spec-overview-links" aria-label="专精详情入口">
    <a href="/portal/spec/{{ class_name }}/{{ spec_name }}/"{% if active_tab == "overview" %} aria-current="page"{% endif %}>人物榜</a>
    <a href="/portal/spec/{{ class_name }}/{{ spec_name }}/#module-mythic-plus">大秘境</a>
    <a href="/portal/spec/{{ class_name }}/{{ spec_name }}/#module-raid">团本</a>
    <a href="/portal/spec/{{ class_name }}/{{ spec_name }}/dungeons/"{% if active_tab == "dungeons" %} aria-current="page"{% endif %}>M+ 详细统计</a>
    <a href="/portal/spec/{{ class_name }}/{{ spec_name }}/raid/"{% if active_tab == "raid" %} aria-current="page"{% endif %}>团本详细统计</a>
</nav>
