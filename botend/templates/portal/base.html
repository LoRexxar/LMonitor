<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/favicon.ico">
    <title>{% block title %}魔兽世界每日节奏{% endblock %}</title>
    {% load static %}
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="{% static 'portal/js/portal-theme.js' %}?v=20260808_portal_theme_v2"></script>
    <link rel="stylesheet" href="{% static 'portal/css/portal.css' %}?v=20260821_mythicstats_clean_light_v7">
    {% block extra_head %}{% endblock %}
    <style>{% block extra_style %}{% endblock %}</style>
</head>
<body class="portal-bg font-sans">
    {% include 'portal/_header.html' %}
    <main style="max-width:1200px;margin:0 auto;padding:20px 16px;">
        {% block content %}{% endblock %}
    </main>
    {% block extra_script %}{% endblock %}
</body>
</html>
