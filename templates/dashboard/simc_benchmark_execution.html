{% load static %}
<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>{{ panel_name }} · 私有执行结果</title>
  <link rel="stylesheet" href="{% static 'dashboard/css/simc-benchmark-dashboard.css' %}?v=20260803f">
</head>
<body class="simc-benchmark-config-body">
<main class="simc-benchmark-config-page benchmark-execution-page" data-benchmark-execution-page data-benchmark-execution-id="{{ execution_id }}">
  <header class="simc-benchmark-config-toolbar">
    <div class="simc-benchmark-config-identity">
      <a class="simc-benchmark-back-link" href="/dashboard/#simc-benchmarks">← 返回基准面板</a>
      <div><span class="simc-benchmark-eyebrow">PRIVATE BENCHMARK RESULT</span><h1>{{ panel_name }}</h1><p>私有执行结果仅在 Dashboard 中可见，不影响 Portal 的公开边界。</p></div>
    </div>
  </header>
  <div data-benchmark-notification class="simc-benchmark-notification" role="status" aria-live="polite" hidden></div>
  <section class="simc-benchmark-form-section benchmark-execution-result-shell">
    <div data-execution-state role="status" aria-live="polite">正在加载执行状态…</div>
    <div data-execution-detail></div>
  </section>
</main>
<script src="{% static 'dashboard/js/simc-benchmark-dashboard.js' %}?v=20260803f"></script>
</body>
</html>
