{% if side.file %}<label>战斗场次<select name="{{ side.key }}_fight"><option value="">在这份日志中择优</option>{% for f in side.fights %}<option value="{{ f.id }}" {% if side.fight == f.id|stringformat:"s" %}selected{% endif %}>#{{ f.id }} {{ f.name }} · {{ f.dungeon_name }} {{ f.level_label }} · {{ f.result }}</option>{% endfor %}</select></label>{% endif %}
<label class="duel-search" hidden>查找角色<input type="search" placeholder="名称、服务器或 GUID" autocomplete="off"></label>
<div class="duel-actors" role="radiogroup" aria-label="{{ side.label }}">{% for guid,name in side.actors %}<label><input type="radio" name="{{ side.key }}" value="{{ guid }}" {% if side.guid == guid %}checked{% endif %}><span>{{ name }}<small>{{ guid }}</small></span></label>{% empty %}<p>没有识别到玩家角色。</p>{% endfor %}</div><p class="no-actors" hidden>没有匹配的角色，请修改搜索词。</p>
