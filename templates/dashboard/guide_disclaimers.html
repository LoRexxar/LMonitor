<div id="guide-disclaimer-workspace" class="class-guide-workspace guide-management-page">
  <div class="page-heading"><h1>免责声明</h1></div>
  <p class="hint">免责声明绑定攻略标签；文章带有该标签时，会在作者区下方显示对应声明。</p>
  <p data-message role="status" aria-live="polite" hidden></p>
  <form id="guide-disclaimer-form" class="management-form">
    <label>攻略标签<select name="tag" disabled><option value="">正在加载标签…</option></select></label>
    <p class="hint" data-tag-summary>选择要维护免责声明的标签。</p>
    <label>声明内容<textarea name="text" rows="9" maxlength="3000" placeholder="输入该标签对应的免责声明" disabled></textarea></label>
    <p class="hint">清空声明内容，或从文章移除该标签，即可隐藏这条声明。</p>
    <div class="actions"><button type="submit" disabled>保存声明</button><span data-save-state class="muted"></span></div>
  </form>
</div>
