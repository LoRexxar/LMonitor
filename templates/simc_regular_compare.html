<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="https://wow.lorexxar.cn/favicon.ico">
    <title>常规模拟对比</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #10b981;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .chart-container {
            position: relative;
            height: 420px;
            width: 100%;
        }
        .config-difference-cell {
            background: #fffbeb;
            box-shadow: inset 3px 0 #f59e0b;
        }
        .cast-timeline-grid {
            display: grid;
            grid-template-columns: 68px repeat(var(--timeline-columns), minmax(220px, 1fr));
            min-width: max-content;
        }
        .cast-timeline-axis, .cast-timeline-lane { position: relative; }
        .cast-timeline-axis { border-right: 1px solid #e5e7eb; }
        .cast-timeline-lane { border-right: 1px solid #e5e7eb; background: repeating-linear-gradient(to bottom, transparent 0, transparent 59px, #f3f4f6 60px); }
        .cast-timeline-tick { position: absolute; right: 8px; transform: translateY(-50%); font-size: 11px; color: #6b7280; white-space: nowrap; }
        .cast-timeline-guide { position: absolute; left: 0; right: 0; border-top: 1px dashed #d1d5db; }
        .cast-timeline-event { position: absolute; left: 8px; right: 8px; transform: translateY(-50%); padding: 1px 5px; border-radius: 4px; background: #ecfdf5; border: 1px solid #a7f3d0; color: #065f46; font-size: 11px; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: default; }
        .cast-timeline-event:hover { z-index: 2; overflow: visible; white-space: normal; background: #d1fae5; }
    </style>
</head>
<body class="bg-gray-100">
    <div class="container mx-auto px-4 py-8">
        <div class="bg-white rounded-lg shadow-md p-6 mb-6">
            <div class="flex items-center justify-between">
                <div>
                    <h1 class="text-3xl font-bold text-gray-900 mb-2">
                        <i class="fas fa-balance-scale text-emerald-600 mr-3"></i>
                        常规模拟对比
                    </h1>
                    <p class="text-gray-600">任务ID: <span id="task-ids" class="font-semibold"></span></p>
                </div>
                <button onclick="window.close()" class="px-4 py-2 bg-gray-500 text-white rounded hover:bg-gray-600 transition-colors">
                    <i class="fas fa-times mr-2"></i>关闭
                </button>
            </div>
        </div>

        <div id="loading-section" class="bg-white rounded-lg shadow-md p-8 text-center">
            <div class="loading mx-auto mb-4"></div>
            <p class="text-gray-600">正在加载对比数据...</p>
        </div>

        <div id="error-section" class="bg-red-50 border border-red-200 rounded-lg p-6 mb-6 hidden">
            <div class="flex items-center">
                <i class="fas fa-exclamation-triangle text-red-500 mr-3"></i>
                <div>
                    <h3 class="text-red-800 font-semibold">加载失败</h3>
                    <p id="error-message" class="text-red-600 mt-1"></p>
                </div>
            </div>
        </div>

        <div id="compare-content" class="hidden space-y-6">
            <div id="comparison-summary" class="bg-white rounded-lg shadow-md p-6"></div>
            <div id="invalid-section" class="bg-yellow-50 border border-yellow-200 rounded-lg p-6 hidden">
                <div class="flex items-center mb-3">
                    <i class="fas fa-exclamation-circle text-yellow-600 mr-3"></i>
                    <h3 class="text-yellow-800 font-semibold">部分任务无法参与对比</h3>
                </div>
                <ul id="invalid-list" class="list-disc list-inside text-yellow-800 space-y-1"></ul>
            </div>

            <div class="bg-white rounded-lg shadow-md p-6">
                <h2 class="text-xl font-semibold text-gray-900 mb-4">
                    <i class="fas fa-chart-line text-emerald-600 mr-2"></i>
                    DPS对比（含差异）
                </h2>
                <div class="chart-container">
                    <canvas id="dps-chart"></canvas>
                </div>
            </div>

            <div class="bg-white rounded-lg shadow-md p-6">
                <h2 class="text-xl font-semibold text-gray-900 mb-4">
                    <i class="fas fa-table text-blue-500 mr-2"></i>
                    任务详情
                </h2>
                <div class="overflow-x-auto">
                    <table class="min-w-max w-full border border-gray-200 rounded-lg">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider border-b whitespace-nowrap">排名</th>
                                <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider border-b whitespace-nowrap">任务ID</th>
                                <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider border-b whitespace-nowrap">任务名称</th>
                                <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider border-b whitespace-nowrap">DPS</th>
                                <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider border-b whitespace-nowrap">APL</th>
                                <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider border-b whitespace-nowrap">Profile</th>
                                <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider border-b whitespace-nowrap">场景</th>
                                <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider border-b whitespace-nowrap">DPS差异（相对基准）</th>
                                <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider border-b whitespace-nowrap">职业/专精</th>
                                <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider border-b whitespace-nowrap">天赋</th>
                                <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider border-b whitespace-nowrap">APL列表</th>
                                <th class="px-4 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider border-b whitespace-nowrap">操作</th>
                            </tr>
                        </thead>
                        <tbody id="task-compare-table" class="bg-white divide-y divide-gray-200"></tbody>
                    </table>
                </div>
            </div>

            <div class="bg-white rounded-lg shadow-md p-6">
                <div class="flex flex-wrap items-center justify-between gap-2 mb-4">
                    <h2 class="text-xl font-semibold text-gray-900">
                        <i class="fas fa-sliders-h text-amber-500 mr-2"></i>
                        配置差异一览
                    </h2>
                    <span class="text-xs text-gray-500">琥珀色单元格表示相对基准任务的冻结输入不同</span>
                </div>
                <div class="overflow-x-auto">
                    <table class="min-w-full border border-gray-200 rounded-lg">
                        <thead class="bg-gray-50" id="config-compare-thead"></thead>
                        <tbody class="bg-white divide-y divide-gray-200" id="config-compare-tbody"></tbody>
                    </table>
                </div>
            </div>

            <div class="bg-white rounded-lg shadow-md p-6">
                <div class="flex flex-wrap items-center justify-between gap-2 mb-4">
                    <h2 class="text-xl font-semibold text-gray-900">
                        <i class="fas fa-stream text-emerald-600 mr-2"></i>
                        施法序列对比
                    </h2>
                    <span id="cast-timeline-summary" class="text-xs text-gray-500"></span>
                </div>
                <p class="text-sm text-gray-600 mb-4">每列为一个任务；所有列共用同一条纵向时间轴。悬浮施法可查看目标、资源与 Buff 快照。</p>
                <div class="overflow-x-auto"><div id="cast-timeline"></div></div>
            </div>

            <div class="bg-white rounded-lg shadow-md p-6">
                <h2 class="text-xl font-semibold text-gray-900 mb-4">
                    <i class="fas fa-bolt text-purple-500 mr-2"></i>
                    技能DPS占比对比
                </h2>
                <div class="mb-3 flex items-center justify-between gap-3">
                    <input id="ability-compare-search" type="text" class="px-3 py-2 border border-gray-300 rounded-md text-sm w-full max-w-sm" placeholder="搜索技能（中英文）">
                    <span id="ability-compare-count" class="text-sm text-gray-500">0 项</span>
                </div>
                <div class="overflow-x-auto">
                    <table class="min-w-full border border-gray-200 rounded-lg">
                        <thead class="bg-gray-50" id="abilities-compare-thead"></thead>
                        <tbody class="bg-white divide-y divide-gray-200" id="abilities-compare-tbody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div id="apl-modal" class="fixed inset-0 bg-black bg-opacity-60 z-50 hidden">
        <div class="flex items-center justify-center min-h-screen p-4">
            <div class="bg-white rounded-lg shadow-xl w-full max-w-5xl">
                <div class="flex items-center justify-between px-5 py-4 border-b border-gray-200">
                    <h3 class="text-lg font-semibold text-gray-900">APL列表 - <span id="apl-modal-title"></span></h3>
                    <button id="apl-modal-close" class="px-3 py-1 bg-gray-500 text-white rounded hover:bg-gray-600">
                        <i class="fas fa-times mr-1"></i>关闭
                    </button>
                </div>
                <div class="p-5">
                    <div class="mb-3 flex flex-wrap items-center justify-between gap-3">
                        <div class="inline-flex border border-gray-300 rounded overflow-hidden" role="group" aria-label="APL显示语言">
                            <button type="button" data-apl-language="apl" class="apl-language-button px-3 py-1.5 text-sm bg-teal-600 text-white">APL</button>
                            <button type="button" data-apl-language="cn" class="apl-language-button px-3 py-1.5 text-sm bg-white text-gray-700 hover:bg-gray-50">中文</button>
                        </div>
                        <span id="apl-modal-status" class="text-sm text-gray-500"></span>
                    </div>
                    <textarea id="apl-modal-content" class="w-full h-[60vh] p-3 border border-gray-300 rounded-md font-mono text-xs bg-gray-50" readonly></textarea>
                    <div class="mt-3 flex justify-end">
                        <button id="apl-modal-copy" class="px-4 py-2 bg-indigo-600 text-white rounded hover:bg-indigo-700">
                            <i class="fas fa-copy mr-1"></i>复制当前内容
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let regularCompareTasks = [];
        let regularCompareTaskId = '';
        const aplModalState = {
            original: '',
            translated: '',
            spec: '',
            language: 'apl',
            loading: false,
        };

        function escapeHtml(text) {
            if (text === null || text === undefined) return '';
            return String(text)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function getUrlParameter(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }

        function translateSkillName(name) {
            return name || '';
        }

        function showError(message) {
            document.getElementById('loading-section').classList.add('hidden');
            const errorSection = document.getElementById('error-section');
            errorSection.classList.remove('hidden');
            document.getElementById('error-message').textContent = message || '未知错误';
        }

        function renderInvalid(invalid) {
            const section = document.getElementById('invalid-section');
            const list = document.getElementById('invalid-list');
            if (!invalid || invalid.length === 0) {
                section.classList.add('hidden');
                list.innerHTML = '';
                return;
            }
            section.classList.remove('hidden');
            list.innerHTML = invalid.map(item => {
                const title = item.name ? `${escapeHtml(item.name)}(#${item.id})` : `#${item.id}`;
                return `<li>${title}: ${escapeHtml(item.error || '')}</li>`;
            }).join('');
        }

        function renderDpsChart(tasks) {
            const maxDps = Math.max(...tasks.map(t => t.dps || 0));
            const labels = tasks.map(t => `${t.name || '任务'}(#${t.id})`);
            const values = tasks.map(t => t.dps || 0);
            const ctx = document.getElementById('dps-chart').getContext('2d');
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'DPS',
                        data: values,
                        borderColor: 'rgba(5, 150, 105, 1)',
                        backgroundColor: 'rgba(16, 185, 129, 0.15)',
                        borderWidth: 3,
                        pointRadius: 6,
                        pointHoverRadius: 8,
                        fill: true,
                        tension: 0.35
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    const value = context.parsed.y || 0;
                                    const deltaPercent = maxDps > 0 ? ((value / maxDps - 1) * 100) : 0;
                                    const sign = deltaPercent >= 0 ? '+' : '';
                                    return [`DPS: ${value.toLocaleString()}`, `差异: ${sign}${deltaPercent.toFixed(1)}%`];
                                }
                            }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: false,
                            ticks: {
                                callback: function(value) {
                                    return value.toLocaleString();
                                }
                            }
                        }
                    }
                }
            });
        }

        function renderTaskTable(tasks) {
            const tbody = document.getElementById('task-compare-table');
            const maxDps = Math.max(...tasks.map(t => t.dps || 0));
            tbody.innerHTML = tasks.map(t => {
                const classSpec = `${escapeHtml((t.character && t.character.class) || '')}${(t.character && t.character.spec) ? ' / ' + escapeHtml(t.character.spec) : ''}`;
                const talents = escapeHtml((t.talents && t.talents.string) || '');
                const aplName = escapeHtml(t.apl_name || '—');
                const profileName = escapeHtml(t.profile_name || '—');
                const battleScenario = escapeHtml(t.battle_scenario || '—');
                const viewUrl = `/dashboard/simc/tasks/${encodeURIComponent(t.id)}/`;
                const dps = t.dps || 0;
                const candidateLabel = escapeHtml((t.candidate_name || '').trim());
                const taskTitle = candidateLabel ? `${escapeHtml(t.name || '')}<div class="text-xs text-violet-600 mt-1">${candidateLabel}${t.is_base_candidate ? '（基础）' : ''}</div>` : escapeHtml(t.name || '');
                const deltaPercent = t.delta_percent;
                const deltaSign = deltaPercent !== null && deltaPercent >= 0 ? '+' : '';
                const deltaClass = deltaPercent === 0 ? 'text-green-700' : (deltaPercent < 0 ? 'text-red-700' : 'text-green-700');
                return `
                    <tr class="hover:bg-gray-50">
                        <td class="px-4 py-3 text-sm font-bold text-gray-900">${t.rank ? `#${t.rank}` : '-'}</td>
                        <td class="px-4 py-3 text-sm text-gray-900">${t.id}</td>
                        <td class="px-4 py-3 text-sm font-medium text-gray-900">${taskTitle}</td>
                        <td class="px-4 py-3 text-sm text-gray-900">${dps.toLocaleString()}</td>
                        <td class="px-4 py-3 text-sm text-gray-700" title="${aplName}">${aplName}</td>
                        <td class="px-4 py-3 text-sm text-gray-700" title="${profileName}">${profileName}</td>
                        <td class="px-4 py-3 text-sm text-gray-700" title="${battleScenario}">${battleScenario}</td>
                        <td class="px-4 py-3 text-sm ${deltaClass}">
                            ${deltaPercent === null || deltaPercent === undefined ? '-' : (t.is_base ? '基准' : `${deltaSign}${deltaPercent.toFixed(2)}% (${Number(t.delta_dps || 0) >= 0 ? '+' : ''}${Number(t.delta_dps || 0).toLocaleString()})`)}
                        </td>
                        <td class="px-4 py-3 text-sm text-gray-700">${classSpec || '-'}</td>
                        <td class="px-4 py-3 text-sm text-gray-700 break-all">${talents || '-'}</td>
                        <td class="px-4 py-3 text-sm text-gray-700">
                            <button onclick="openAplModal('${escapeHtml(t.name || '')}', '${encodeURIComponent(t.apl_list || '')}', '${escapeHtml(t.spec || '')}')" class="px-3 py-1 bg-teal-600 text-white rounded hover:bg-teal-700 transition-colors duration-200 text-sm">
                                <i class="fas fa-code mr-1"></i>查看APL
                            </button>
                        </td>
                        <td class="px-4 py-3 text-center">
                            <a href="${viewUrl}" target="_blank" class="px-3 py-1 bg-purple-600 text-white rounded hover:bg-purple-700 transition-colors duration-200 text-sm">
                                <i class="fas fa-file-alt mr-1"></i>查看结果
                            </a>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function renderAplModalLanguage() {
            const content = document.getElementById('apl-modal-content');
            const status = document.getElementById('apl-modal-status');
            content.value = aplModalState.language === 'cn'
                ? aplModalState.translated
                : aplModalState.original;
            document.querySelectorAll('.apl-language-button').forEach(button => {
                const active = button.dataset.aplLanguage === aplModalState.language;
                button.classList.toggle('bg-teal-600', active);
                button.classList.toggle('text-white', active);
                button.classList.toggle('bg-white', !active);
                button.classList.toggle('text-gray-700', !active);
                button.disabled = aplModalState.loading;
            });
            status.textContent = aplModalState.loading
                ? '翻译中...'
                : (aplModalState.language === 'cn' ? '中文翻译' : '原始 APL');
        }

        async function switchAplModalLanguage(language) {
            if (language === 'apl') {
                aplModalState.language = 'apl';
                renderAplModalLanguage();
                return;
            }
            if (aplModalState.translated) {
                aplModalState.language = 'cn';
                renderAplModalLanguage();
                return;
            }
            if (aplModalState.loading || !aplModalState.original.trim()) return;
            aplModalState.loading = true;
            renderAplModalLanguage();
            try {
                const response = await fetch('/api/convert-text/', {
                    method: 'POST',
                    credentials: 'same-origin',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        text: aplModalState.original,
                        conversion_type: 'apl_to_cn',
                        spec: aplModalState.spec,
                    }),
                });
                const data = await response.json();
                if (!response.ok || !data.success) {
                    throw new Error((data && data.error) || '翻译失败');
                }
                aplModalState.translated = data.result || '';
                aplModalState.language = 'cn';
                aplModalState.loading = false;
                renderAplModalLanguage();
            } catch (error) {
                aplModalState.loading = false;
                renderAplModalLanguage();
                document.getElementById('apl-modal-status').textContent = error.message || '翻译失败';
            }
        }

        function openAplModal(taskName, encodedApl, spec) {
            const modal = document.getElementById('apl-modal');
            document.getElementById('apl-modal-title').textContent = taskName || '';
            aplModalState.original = decodeURIComponent(encodedApl || '');
            aplModalState.translated = '';
            aplModalState.spec = spec || '';
            aplModalState.language = 'apl';
            aplModalState.loading = false;
            renderAplModalLanguage();
            modal.classList.remove('hidden');
        }

        function closeAplModal() {
            document.getElementById('apl-modal').classList.add('hidden');
        }

        function renderConfigurationCompare(tasks) {
            const thead = document.getElementById('config-compare-thead');
            const tbody = document.getElementById('config-compare-tbody');
            const keys = [];
            const labels = new Map();
            tasks.forEach(task => Object.entries(task.config_facts || {}).forEach(([key, fact]) => {
                if (!labels.has(key)) keys.push(key);
                labels.set(key, (fact && fact.label) || key);
            }));
            thead.innerHTML = `<tr><th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider border-b">配置</th>${tasks.map(task => `<th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider border-b min-w-[13rem]">${escapeHtml(task.name || '任务')}(#${task.id})${task.is_base ? '（基准）' : ''}</th>`).join('')}</tr>`;
            if (!keys.length) {
                tbody.innerHTML = `<tr><td colspan="${tasks.length + 1}" class="px-4 py-6 text-center text-gray-500">未读取到冻结配置快照</td></tr>`;
                return;
            }
            tbody.innerHTML = keys.map(key => `<tr class="hover:bg-gray-50"><td class="px-4 py-3 text-sm font-medium text-gray-900 align-top">${escapeHtml(labels.get(key))}</td>${tasks.map(task => {
                const fact = (task.config_facts || {})[key];
                const changed = !!(fact && fact.is_different);
                return `<td class="px-4 py-3 text-sm text-gray-700 break-all align-top ${changed ? 'config-difference-cell' : ''}">${escapeHtml((fact && fact.display) || '—')}</td>`;
            }).join('')}</tr>`).join('');
        }

        function renderCastTimeline(tasks) {
            const host = document.getElementById('cast-timeline');
            const summary = document.getElementById('cast-timeline-summary');
            const sequences = tasks.map(task => (Array.isArray(task.sample_sequence) ? task.sample_sequence : []).filter(row => Number.isFinite(Number(row.time_seconds))));
            const eventCount = sequences.reduce((total, sequence) => total + sequence.length, 0);
            if (!eventCount) {
                summary.textContent = '无可用施法序列';
                host.innerHTML = '<div class="py-8 text-center text-gray-500">此批次结果未包含 Sample Sequence Table。</div>';
                return;
            }
            const allEvents = sequences.flat();
            const minTime = Math.min(...allEvents.map(row => Number(row.time_seconds)));
            const maxTime = Math.max(...allEvents.map(row => Number(row.time_seconds)));
            const timelineDuration = Math.max(1, maxTime - minTime);
            const pixelsPerSecond = 16;
            const height = Math.max(540, Math.ceil((maxTime - minTime) * pixelsPerSecond) + 48);
            const desiredTick = Math.max(5, timelineDuration / 8);
            const magnitude = Math.pow(10, Math.floor(Math.log10(desiredTick)));
            const tickStep = Math.ceil(desiredTick / magnitude) * magnitude;
            const tickStart = Math.floor(minTime / tickStep) * tickStep;
            const ticks = [];
            for (let time = tickStart; time <= maxTime + 0.001; time += tickStep) ticks.push(Math.round(time * 1000) / 1000);
            const topFor = time => 24 + (Number(time || 0) - minTime) * pixelsPerSecond;
            const titleFor = row => [
                `${row.time_label || Number(row.time_seconds).toFixed(3) + 's'} · ${row.action || ''}`,
                row.action_list ? `APL：${row.action_list}` : '',
                row.target ? `目标：${row.target}` : '',
                row.resources ? `资源：${row.resources}` : '',
                row.buffs ? `Buff：${row.buffs}` : '',
            ].filter(Boolean).join('\n');
            const eventsForLane = sequence => {
                const slotsByTime = new Map();
                sequence.forEach(row => {
                    const key = Number(row.time_seconds).toFixed(3);
                    if (!slotsByTime.has(key)) slotsByTime.set(key, []);
                    slotsByTime.get(key).push(row);
                });
                return sequence.map(row => {
                    const peers = slotsByTime.get(Number(row.time_seconds).toFixed(3));
                    const slot = peers.indexOf(row);
                    return `<span class="cast-timeline-event" style="top:${topFor(row.time_seconds)}px;left:calc(8px + (${slot} / ${peers.length}) * (100% - 16px));right:auto;width:calc((100% - 16px) / ${peers.length})" title="${escapeHtml(titleFor(row))}">${escapeHtml(row.action || '')}</span>`;
                }).join('');
            };
            summary.textContent = `${eventCount} 次施法 · ${minTime.toFixed(1)}–${maxTime.toFixed(1)} 秒`;
            host.innerHTML = `<div class="cast-timeline-grid" style="--timeline-columns:${tasks.length}"><div class="bg-gray-50 border-b border-gray-200 px-2 py-3 text-xs font-semibold text-gray-500">时间</div>${tasks.map(task => `<div class="bg-gray-50 border-b border-gray-200 px-3 py-3 text-sm font-semibold text-gray-900">${escapeHtml(task.name || '任务')}(#${task.id})${task.is_base ? ' <span class="text-xs text-blue-600">基准</span>' : ''}</div>`).join('')}<div class="cast-timeline-axis" style="height:${height}px">${ticks.map(time => `<span class="cast-timeline-tick" style="top:${topFor(time)}px">${time}s</span>`).join('')}</div>${tasks.map((task, index) => `<div class="cast-timeline-lane" style="height:${height}px">${ticks.map(time => `<span class="cast-timeline-guide" style="top:${topFor(time)}px"></span>`).join('')}${eventsForLane(sequences[index])}</div>`).join('')}</div>`;
        }

        function renderAbilityCompare(tasks) {
            const thead = document.getElementById('abilities-compare-thead');
            const tbody = document.getElementById('abilities-compare-tbody');
            const searchInput = document.getElementById('ability-compare-search');
            const countEl = document.getElementById('ability-compare-count');

            const names = new Set();
            tasks.forEach(t => {
                const abilities = (t.abilities || t.top_abilities || []);
                abilities.forEach(a => {
                    if (a && a.name) names.add(translateSkillName(a.name));
                });
            });
            const abilityNames = Array.from(names);
            if (abilityNames.length === 0) {
                thead.innerHTML = '';
                tbody.innerHTML = `<tr><td class="px-4 py-6 text-center text-gray-500" colspan="${tasks.length + 1}">未解析到技能占比数据</td></tr>`;
                if (countEl) countEl.textContent = '0 项';
                return;
            }

            const baselineTask = tasks.find(t => t.is_base) || tasks[0];
            const baselineTaskId = baselineTask ? baselineTask.id : null;

            function parsePercent(text) {
                if (!text || typeof text !== 'string') return null;
                const m = text.match(/([\d.]+)/);
                if (!m) return null;
                const v = parseFloat(m[1]);
                return Number.isFinite(v) ? v : null;
            }

            thead.innerHTML = `
                <tr>
                    <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider border-b">技能</th>
                    ${tasks.map(t => `<th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider border-b">${escapeHtml(t.name || '')}(#${t.id})${baselineTaskId === t.id ? '（基准）' : ''}</th>`).join('')}
                </tr>
            `;

            const abilityMap = new Map();
            tasks.forEach(t => {
                const m = new Map();
                (t.abilities || t.top_abilities || []).forEach(a => {
                    if (!a || !a.name) return;
                    m.set(translateSkillName(a.name), {
                        dps: a.dps || '',
                        percent: a.dps_percent || '',
                    });
                });
                abilityMap.set(t.id, m);
            });

            const baselineMap = baselineTaskId ? abilityMap.get(baselineTaskId) : null;
            const keyword = (searchInput ? searchInput.value : '').trim().toLowerCase();
            const filteredAbilityNames = abilityNames
                .filter(name => !keyword || String(name || '').toLowerCase().includes(keyword))
                .sort((a, b) => {
                    const av = parsePercent(baselineMap ? (baselineMap.get(a)?.percent || '') : '') || -1;
                    const bv = parsePercent(baselineMap ? (baselineMap.get(b)?.percent || '') : '') || -1;
                    return bv - av;
                });

            if (countEl) countEl.textContent = `${filteredAbilityNames.length} 项`;

            tbody.innerHTML = filteredAbilityNames.map(name => {
                const baselineAbility = baselineMap ? baselineMap.get(name) : null;
                const baselineText = baselineAbility?.percent || '';
                const baselineValue = parsePercent(baselineText);
                const cols = tasks.map(t => {
                    const m = abilityMap.get(t.id);
                    const ability = m ? m.get(name) : null;
                    const valueText = ability?.percent || '';
                    const valueNumber = parsePercent(valueText);
                    if (!valueText) {
                        return `<td class="px-4 py-3 text-sm text-gray-700">-</td>`;
                    }
                    const dpsText = ability?.dps ? `${Number(ability.dps).toLocaleString()} DPS` : '';
                    if (!baselineTaskId || baselineTaskId === t.id || baselineValue === null || valueNumber === null) {
                        return `<td class="px-4 py-3 text-sm text-gray-700"><div>${escapeHtml(valueText)}</div><div class="text-xs text-gray-500">${escapeHtml(dpsText)}</div></td>`;
                    }

                    const delta = valueNumber - baselineValue;
                    const deltaSign = delta >= 0 ? '+' : '';
                    const deltaClass = delta >= 0 ? 'text-green-700' : 'text-red-700';
                    return `<td class="px-4 py-3 text-sm text-gray-700">
                        <div>${escapeHtml(valueText)}</div>
                        <div class="text-xs text-gray-500">${escapeHtml(dpsText)}</div>
                        <div class="text-xs ${deltaClass}">${deltaSign}${delta.toFixed(1)} 个百分点</div>
                    </td>`;
                }).join('');
                return `
                    <tr class="hover:bg-gray-50">
                        <td class="px-4 py-3 text-sm font-medium text-gray-900">${escapeHtml(name)}</td>
                        ${cols}
                    </tr>
                `;
            }).join('');
        }

        async function loadCompare() {
            const taskIds = getUrlParameter('task_ids') || '';
            const taskId = getUrlParameter('task_id') || '';
            const query = taskIds ? `task_ids=${encodeURIComponent(taskIds)}` : `task_id=${encodeURIComponent(taskId)}`;
            document.getElementById('task-ids').textContent = taskIds ? `任务 ${taskIds}` : (taskId ? `任务 ${taskId}` : '-');
            if (!taskIds && !taskId) {
                showError('缺少 task_ids 参数');
                return;
            }

            try {
                const resp = await fetch(`/api/simc-regular-compare/?${query}`, {
                    method: 'GET',
                    credentials: 'same-origin'
                });

                if (resp.redirected) {
                    window.location.href = resp.url;
                    return;
                }

                const data = await resp.json();
                if (!data || !data.success) {
                    showError((data && data.error) || '加载失败');
                    return;
                }

                const tasks = (data.data && data.data.runs) || [];
                const invalid = (data.data && data.data.invalid) || [];
                const comparison = (data.data && data.data.comparison) || {};
                regularCompareTaskId = taskIds || taskId;

                if (!tasks || tasks.length < 2) {
                    showError('可用于对比的任务不足2个');
                    return;
                }

                tasks.sort((a, b) => (b.dps || 0) - (a.dps || 0));
                regularCompareTasks = tasks;
                const baseline = comparison.baseline || {};
                const winner = comparison.winner || {};
                document.getElementById('comparison-summary').innerHTML = `
                    <h2 class="text-xl font-semibold text-gray-900 mb-3"><i class="fas fa-trophy text-yellow-500 mr-2"></i>对比结论</h2>
                    <div class="grid md:grid-cols-3 gap-4 text-sm">
                        <div><span class="text-gray-500">样本数</span><div class="text-2xl font-bold">${tasks.length}</div></div>
                        <div><span class="text-gray-500">基准样本</span><div class="font-semibold">${escapeHtml(baseline.label || '-')} · ${Number(baseline.dps || 0).toLocaleString()} DPS</div></div>
                        <div><span class="text-gray-500">最优样本</span><div class="font-semibold text-green-700">${escapeHtml(winner.label || '-')} · ${Number(winner.dps || 0).toLocaleString()} DPS</div><div class="text-xs text-green-700">相对基准 ${Number(winner.delta_percent || 0) >= 0 ? '+' : ''}${Number(winner.delta_percent || 0).toFixed(2)}%</div></div>
                    </div>`;
                renderInvalid(invalid);
                renderDpsChart(tasks);
                renderTaskTable(tasks);
                renderConfigurationCompare(tasks);
                renderCastTimeline(tasks);
                renderAbilityCompare(tasks);

                document.getElementById('loading-section').classList.add('hidden');
                document.getElementById('compare-content').classList.remove('hidden');
            } catch (e) {
                showError('加载失败');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const closeBtn = document.getElementById('apl-modal-close');
            const copyBtn = document.getElementById('apl-modal-copy');
            const modal = document.getElementById('apl-modal');
            if (closeBtn) closeBtn.addEventListener('click', closeAplModal);
            if (modal) modal.addEventListener('click', (e) => {
                if (e.target === modal) closeAplModal();
            });
            if (copyBtn) copyBtn.addEventListener('click', async () => {
                const text = document.getElementById('apl-modal-content').value || '';
                try {
                    await navigator.clipboard.writeText(text);
                } catch (e) {}
            });
            document.querySelectorAll('.apl-language-button').forEach(button => {
                button.addEventListener('click', () => switchAplModalLanguage(button.dataset.aplLanguage));
            });
            const abilitySearch = document.getElementById('ability-compare-search');
            if (abilitySearch) {
                abilitySearch.addEventListener('input', () => {
                    if (regularCompareTasks && regularCompareTasks.length) {
                        renderAbilityCompare(regularCompareTasks);
                    }
                });
            }
            loadCompare();
        });
    </script>
</body>
