{% firstof ranking_route 'portal_simc_reference_rankings' as route_name %}
<a class="simc-ranking-button simc-ranking-overall" href="{% url route_name config_id signature 'overall' %}" aria-label="查看{% if targets == 1 %}单体{% else %}{{ targets }} 目标{% endif %}全职业榜单"><span class="simc-ranking-label">全职业</span> <strong>{{ ranking.overall_rank }}</strong> <span class="simc-ranking-total">/ {{ ranking.overall_total }}</span></a>
<a class="simc-ranking-button simc-ranking-spec" href="{% url route_name config_id signature 'spec' %}" aria-label="查看{% if targets == 1 %}单体{% else %}{{ targets }} 目标{% endif %}本专精榜单"><span class="simc-ranking-label">本专精</span> <strong>{{ ranking.spec_rank }}</strong> <span class="simc-ranking-total">/ {{ ranking.spec_total }}</span></a>
