<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/favicon.ico">
    <title>SimC 基准结果 · WowDaily.cn</title>
    {% load static %}
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="{% static 'portal/js/portal-theme.js' %}?v=20260808_portal_theme"></script>
    <link rel="stylesheet" href="{% static 'portal/css/portal.css' %}?v=20260808_portal_theme_v2">
    <link rel="stylesheet" href="{% static 'portal/css/simc-benchmarks.css' %}?v=20260805_description_card_clean">
</head>
<body class="portal-bg font-sans">
    {% include 'portal/_header.html' %}
    <main class="max-w-[1200px] mx-auto px-4 py-8">
        <section class="portal-card portal-card-accent portal-accent-indigo shadow-sm border border-slate-200/70 p-5">
            <div class="simc-benchmark-heading">
                <div>
                    <h1 id="simc-benchmarks-title">{% if benchmark_panel_id is None %}simc模拟数据列表{% else %}模拟结果{% endif %}</h1>
                    <div id="simc-benchmarks-description" class="simc-benchmark-description-card">
                        <div class="simc-benchmark-description-content">{% if benchmark_panel_id is None %}查看公开基线任务的数据量、更新时间及模拟结果。{% else %}独立展示已发布的基准模拟结果。选择专精、战斗场景和 Profile，查看当前组合下候选方案的 DPS 排名。{% endif %}</div>
                    </div>
                </div>
            </div>
            <div id="simc-benchmark-root" class="simc-benchmark-panels" aria-live="polite" aria-busy="true"{% if benchmark_panel_id is not None %} data-panel-id="{{ benchmark_panel_id }}"{% endif %}>
                <div class="simc-benchmark-state" role="status">正在加载 Benchmark 结果…</div>
            </div>
        </section>
    </main>
    <script src="{% static 'portal/js/simc-benchmarks.js' %}?v=20260805_description_card_clean"></script>
</body>
</html>
