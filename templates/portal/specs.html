<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/favicon.ico">
    <title>全职业数据 - 魔兽世界每日节奏</title>
    {% load static %}
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="{% static 'portal/js/portal-theme.js' %}?v=20260903_unified_navigation"></script>
    <link rel="stylesheet" href="{% static 'portal/css/portal.css' %}?v=20260903_external_menu_v2">
</head>
<body class="portal-bg font-sans">
    {% include 'portal/_header.html' %}

    <main class="max-w-[1200px] mx-auto px-4 py-6">
        <div class="portal-card shadow-sm border border-slate-200/70 p-4 mb-4">
            <div class="flex items-center gap-2 font-semibold text-slate-900">
                <svg class="w-5 h-5" aria-hidden="true"><use href="{% static 'portal/icons/icons.svg' %}#icon-chart"></use></svg>
                <span class="text-lg">全职业数据</span>
                <span class="text-xs text-slate-400 font-normal ml-2">点击专精图标查看 Top 20 人物榜 / M+ / 团本数据</span>
            </div>
        </div>
        <div id="spec-class-grid" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px;">
            {% for cls in classes %}
            <div class="portal-card" style="padding:12px;border-radius:10px;background:#fff;border:1px solid #e2e8f0;transition:box-shadow 0.15s" onmouseover="this.style.boxShadow='0 4px 12px rgba(0,0,0,0.08)'" onmouseout="this.style.boxShadow=''">
                <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid #f1f5f9">
                    <img src="{{ cls.icon }}" alt="{{ cls.name }}" width="24" height="24" style="border-radius:6px" loading="lazy">
                    <span style="font-size:14px;font-weight:600;color:{{ cls.color }}">{{ cls.name }}</span>
                </div>
                <div style="display:flex;flex-wrap:wrap;gap:4px">
                    {% for spec in cls.specs %}
                    <a href="{% url 'spec_detail_player' class_name=cls.key spec_name=spec.key %}" style="display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px;border-radius:6px;text-decoration:none;transition:background 0.15s" onmouseover="this.style.background='rgba(241,245,249,0.8)'" onmouseout="this.style.background=''" title="{{ cls.name }} · {{ spec.name }}">
                        <img src="{{ spec.icon }}" alt="{{ spec.name }}" width="36" height="36" style="border-radius:6px;border:1px solid transparent;transition:border-color 0.15s" onmouseover="this.style.borderColor='#818cf8'" onmouseout="this.style.borderColor='transparent'" loading="lazy">
                        <span style="font-size:11px;color:#475569;text-align:center;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;width:100%">{{ spec.name }}</span>
                    </a>
                    {% endfor %}
                </div>
            </div>
            {% endfor %}
        </div>
    </main>
</body>
</html>
