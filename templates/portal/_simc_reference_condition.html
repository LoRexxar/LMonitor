{% for segment in segments %}{% if segment.reference %}{% include 'portal/_simc_reference_spell.html' with spell=segment.reference compact=True only %}{% elif segment.variable %}<a class="reference-variable-link" href="#{{ segment.variable.anchor }}" data-apl-jump data-apl-rule="{{ segment.variable.rule_anchor }}" title="查看此变量的计算规则">变量「{{ segment.variable.name }}」</a>{% elif segment.raw %}<code class="reference-condition-raw"{% if segment.reason %} data-condition-unresolved="{{ segment.reason }}"{% endif %}>{{ segment.raw }}</code>{% else %}{{ segment.text }}{% endif %}{% endfor %}
