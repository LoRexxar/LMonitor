{% load static simc_display %}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="/favicon.ico">
    <title>专精模拟资料 · WowDaily</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="{% static 'portal/js/portal-theme.js' %}"></script>
    <link rel="stylesheet" href="{% static 'portal/css/portal.css' %}">
    <link rel="stylesheet" href="{% static 'shared/css/wow-item-tooltip.css' %}">
    <link rel="stylesheet" href="{% static 'portal/css/simc-reference.css' %}?v=20261116_partial_loading">
    <link rel="stylesheet" href="{% static 'portal/css/player-talent-tree.css' %}?v=20261116_dynamic_tree">
    <script defer src="{% static 'portal/js/player-talent-tree.js' %}?v=20261116_dynamic_tree"></script>
    <link rel="stylesheet" href="{% static 'shared/css/simc-reference-rankings.css' %}?v=20261113_roles_icons">
    <link rel="stylesheet" href="{% static 'shared/css/simc-reference-layout.css' %}?v=20261112_framed_results">
</head>
<body class="portal-bg font-sans simc-reference-page">
{% include 'portal/_header.html' %}
<main class="simc-reference">
    {% include 'shared/simc_reference_navigation.html' %}
    <header class="reference-heading simc-page-heading"><div>
        <div class="reference-title-row"><h1>专精模拟资料</h1><span class="reference-beta">内测</span></div>
        <p>从天赋构筑、装备选择到技能优先级，完整了解一份模拟的配置。</p>
    </div></header>

    <div id="reference-navigation-status" class="reference-navigation-status" role="status" aria-live="polite" hidden>
        <span class="reference-loading-spinner" aria-hidden="true"></span>
        <div><strong data-reference-loading-label></strong><p data-reference-loading-detail></p><a data-reference-loading-retry hidden>重新加载</a></div>
    </div>
    <div class="reference-workbench">
    {% include 'portal/_simc_reference_workspace.html' %}
    </div>
    <p id="reference-copy-status" class="reference-copy-status" role="status" aria-live="polite"></p>
    <footer class="reference-footer">当前共享模拟资料 · 历史模拟请以该任务保存的输入为准。</footer>
</main>
<script src="{% static 'shared/js/wow-item-tooltip.js' %}?v=20261117_preview_hover"></script>
<script src="{% static 'portal/js/simc-reference.js' %}?v=20261116_partial_loading"></script>
</body>
</html>
