{% extends 'portal/nga_base.html' %}
{% block content %}
<header class="nga-heading">
    <div><p class="nga-kicker">社区 · NGA</p><h1>NGA 帖子</h1></div>
    <a href="/">返回首页</a>
</header>
<p class="nga-scope">浏览本站已采集并公开的 NGA 帖子，不限首页热门。仅覆盖现有采集范围，并非 NGA 全论坛；回复数为采集时记录，时间为本站记录时间。</p>
<form id="nga-filters" class="nga-filters" method="get">
    <div class="nga-search"><label for="nga-search">搜索标题、摘要与已采集正文</label><input id="nga-search" name="q" type="search" maxlength="120" value="{{ q }}" placeholder="输入关键词"></div>
    <div><label for="nga-board">板块</label><select id="nga-board" name="board">
        <option value="">全部板块</option>
        {% for item in boards %}<option value="{{ item.key }}"{% if board == item.key %} selected{% endif %}>{{ item.label }}</option>{% endfor %}
        <option value="unknown"{% if board == 'unknown' %} selected{% endif %}>板块未记录</option>
    </select></div>
    <div><label for="nga-sort">排序</label><select id="nga-sort" name="sort"><option value="newest"{% if sort == 'newest' %} selected{% endif %}>最新记录</option><option value="replies"{% if sort == 'replies' %} selected{% endif %}>回复最多</option></select></div>
    <button type="submit">筛选</button><a href="{% url 'portal_nga' %}">重置</a>
</form>
{% include 'portal/_nga_batch.html' %}
<p id="nga-batch-status" class="nga-meta" role="status" aria-live="polite"></p>
{% load static %}<script defer src="{% static 'portal/js/nga-browse.js' %}?v=20260908_batches"></script>
{% endblock %}
